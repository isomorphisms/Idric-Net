name: Idric-Net CI

on:
  push:
    branches:
      - net
  pull_request:
  workflow_dispatch:

jobs:
  typed-network:
    runs-on: ubuntu-24.04
    env:
      IDRIC_COMPILER_REF: Idriç
    steps:
      - name: Checkout Idric-Net
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout Idriç compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: ${{ env.IDRIC_COMPILER_REF }}
          path: .tools/Idric

      - name: Install compiler bootstrap dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends chezscheme

      - name: Build current Idriç and run Idric-Net semantic tests
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: ci/run-current-head.sh

      - name: Verify ai-ci contract
        uses: isomorphisms/ai-ci@a1c4c50970af13c59d25aabce737ca7c09451c22
        with:
          suite: ci/ai-ci.suite.tsv
          root: .

      - name: Retain current-head compatibility receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idric-net-current-head-receipt
          path: build/current-head-receipt.tsv
          if-no-files-found: warn
